name: "Zig Actions"
description: "A modular Zig CI (for now)"

author: "YetAnotherMechanicusEnjoyer"
branding:
  icon: "package"
  color: "yellow"

inputs:
  zig-version:
    description: "Zig version"
    required: false
    default: "0.16.0"
  working-directory:
    description: "Root directroy"
    required: false
    default: "."

  command-test:
    description: "Build test command"
    required: false
    default: "zig build test"
  failure-on-error:
    description: "Return an Action Failure on error"
    required: false
    default: "true"

  command-docs:
    description: "Build documentation command"
    required: false
    default: "zig build docs"
  docs-directory:
    description: "Generated docs directory (e.g.: zig-out/docs)"
    required: false
    default: "zig-out/docs"
  deploy-branch:
    description: "Branch to deploy on (e.g.: gh-pages)"
    required: false
    default: "gh-pages"

  binary-name:
    description: "Binary name (without extension)"
    required: true
  target:
    description: "Compilation target (ex: x86_64-linux, aarch64-macos)"
    required: true
  optimize:
    description: "Compilation optimization (Debug, ReleaseSafe, ReleaseFast, ReleaseSmall)"
    required: false
    default: "ReleaseFast"
  extra-files:
    description: "Files to include in the archive (separated by commas)"
    required: false

  github-token:
    description: "GitHub Token (secrets.GITHUB_TOKEN)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Zig CI
      uses: YetAnotherMechanicusEnjoyer/zig-actions/ci@v1
      with:
        zig-version: ${{ inputs.zig-version }}
        working-directory: ${{ inputs.working-directory }}
        command-test: ${{ inputs.command-test }}
        failure-on-error: ${{ inputs.failure-on-error }}

    - name: Zig Docs CD
      uses: YetAnotherMechanicusEnjoyer/zig-actions/docs@v1
      with:
        zig-version: ${{ inputs.zig-version }}
        working-directory: ${{ inputs.working-directory }}
        command-docs: ${{ inputs.command-docs }}
        docs-directory: ${{ inputs.docs-directory }}
        deploy-branch: ${{ inputs.deploy-branch }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Zig Release
      uses: YetAnotherMechanicusEnjoyer/zig-actions/release@v1
      with:
        zig-version: ${{ inputs.zig-version }}
        working-directory: ${{ inputs.working-directory }}
        binary-name: ${{ inputs.binary-name }}
        target: ${{ inputs.target }}
        optimize: ${{ inputs.optimize }}
        extra-files: ${{ inputs.extra-files }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
