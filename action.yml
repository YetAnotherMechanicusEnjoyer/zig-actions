name: "Zig Actions"
description: "A modular Zig CI (for now)"

author: "YetAnotherMechanicusEnjoyer"
branding:
  icon: "package"
  color: "yellow"

inputs:
  zig-version:
    description: "Zig version"
    required: false
    default: "0.16.0"
  working-directory:
    description: "Root directroy"
    required: false
    default: "."
  command-test:
    description: "Build test command"
    required: false
    default: "zig build test"
  failure-on-error:
    description: "Return an Action Failure on error"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Zig CI
      uses: ./ci
      with:
        zig-version: ${{ inputs.zig-version }}
        working-directory: ${{ inputs.working-directory }}
        command-test: ${{ inputs.command-test }}
        failure-on-error: ${{ inputs.failure-on-error }}
