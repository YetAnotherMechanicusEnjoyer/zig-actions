name: Test Zig Release
run-name: Test Zig Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish:
    name: Publishing for ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - uses: ./release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          zig-version: "0.16.0"
          working-directory: "./tests/release"
          binary-name: "main"
          target: ${{ matrix.target }}
